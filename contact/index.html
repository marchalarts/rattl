<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RATTL — Contact</title>
  <meta
    name="description"
    content="Vertel me waar je mee zit of waar je naartoe wilt. De rest ontdekken we samen."
  >

  <link
    rel="icon"
    href="/images/xjHt9PPm9otogAFcPaLrXVPlfE.png"
    media="(prefers-color-scheme: light)"
  >
  <link
    rel="icon"
    href="/images/xjHt9PPm9otogAFcPaLrXVPlfE.png"
    media="(prefers-color-scheme: dark)"
  >
  <link
    rel="apple-touch-icon"
    href="/images/ZfFiLiHlZAlTWgZAWAUUb1BLGiw.png"
  >

  <style>
    @font-face {
      font-family: "Base Neue Trial Extra Bold";
      src: url("/fonts/cKiQH3kp476W8EmgoIoGGB3xYAs.woff2") format("woff2");
      font-display: swap;
      font-style: normal;
      font-weight: 800;
    }

    @font-face {
      font-family: "Base Neue Trial Bold";
      src: url("/fonts/qfQFdaLjzy6hR4ehNJXKKsEoXk.woff2") format("woff2");
      font-display: swap;
      font-style: normal;
      font-weight: 700;
    }

    @font-face {
      font-family: "Base Neue Trial Regular";
      src: url("/fonts/ddiD5uhS2kygYKON6agUNqWHdYI.woff2") format("woff2");
      font-display: swap;
      font-style: normal;
      font-weight: 400;
    }

    @font-face {
      font-family: "Alegreya Sans";
      src: url("/fonts/GrgcKwrN6d3Uz8EwcLHZxwEfC4.woff2") format("woff2");
      font-display: swap;
      font-style: normal;
      font-weight: 400;
    }

    :root {
      --navy: #031b28;
      --orange: #c9542a;
      --cream: #f6ecdd;
      --white: #ffffff;
      --border: rgba(3, 27, 40, 0.24);
      --focus: rgba(201, 84, 42, 0.32);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--cream);
      color: var(--navy);
      font-family: "Alegreya Sans", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .site-header {
      width: min(100% - 48px, 1380px);
      margin: 0 auto;
      padding: 28px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }

    .logo {
      display: block;
      width: 174px;
      flex: 0 0 auto;
    }

    .logo img {
      display: block;
      width: 100%;
      height: auto;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 34px;
      font-family: "Base Neue Trial Bold", Arial, sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .nav a {
      position: relative;
      padding: 8px 0;
    }

    .nav a:not(.nav-cta)::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 1px;
      height: 2px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 220ms ease;
    }

    .nav a:not(.nav-cta):hover::after,
    .nav a:not(.nav-cta):focus-visible::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .nav-cta {
      padding: 14px 22px !important;
      border: 1px solid var(--navy);
      border-radius: 999px;
      transition:
        background-color 180ms ease,
        color 180ms ease;
    }

    .nav-cta:hover,
    .nav-cta:focus-visible {
      background: var(--navy);
      color: var(--cream);
    }

    main {
      width: min(100% - 48px, 1110px);
      margin: 0 auto;
      padding: 70px 0 120px;
    }

    .intro {
      width: min(100%, 830px);
      margin: 0 auto 62px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-family: "Base Neue Trial Extra Bold", Arial, sans-serif;
      font-size: clamp(34px, 4.5vw, 46px);
      font-weight: 800;
      line-height: 0.98;
      letter-spacing: -0.025em;
      text-transform: uppercase;
    }

    .intro p {
      margin: 24px auto 0;
      max-width: 720px;
      font-size: clamp(23px, 2.25vw, 31px);
      line-height: 1.3;
      color: rgba(3, 27, 40, 0.82);
      font-weight: 300;
    }

    .contact-form {
      width: min(100%, 890px);
      margin: 0 auto;
      padding: 50px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.18);
    }

    .field {
      display: grid;
      gap: 12px;
      margin: 0 0 32px;
    }

    .field-label,
    .group-title {
      font-family: "Base Neue Trial Bold", Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
    }

    .text-input,
    .textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: transparent;
      color: var(--navy);
      outline: none;
      transition:
        border-color 180ms ease,
        box-shadow 180ms ease,
        background-color 180ms ease;
    }

    .text-input {
      height: 58px;
      padding: 0 18px;
      font-size: 20px;
    }

    .textarea {
      min-height: 180px;
      padding: 17px 18px;
      resize: vertical;
      font-size: 20px;
      line-height: 1.45;
    }

    .text-input::placeholder,
    .textarea::placeholder {
      color: rgba(3, 27, 40, 0.44);
    }

    .text-input:focus,
    .textarea:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 4px var(--focus);
      background: rgba(255, 255, 255, 0.35);
    }

    .choice-group {
      margin: 0 0 32px;
    }

    .group-title {
      margin: 0 0 14px;
    }

    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .choice {
      position: relative;
      display: inline-flex;
    }

    .choice input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .choice span {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 9px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 18px;
      line-height: 1.2;
      cursor: pointer;
      transition:
        color 180ms ease,
        background-color 180ms ease,
        border-color 180ms ease,
        transform 180ms ease;
    }

    .choice span:hover {
      transform: translateY(-1px);
      border-color: var(--navy);
    }

    .choice input:focus-visible + span {
      box-shadow: 0 0 0 4px var(--focus);
    }

    .choice input:checked + span {
      border-color: var(--navy);
      background: var(--navy);
      color: var(--cream);
    }

    .submit {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 999px;
      background: var(--orange);
      color: var(--cream);
      font-family: "Base Neue Trial Bold", Arial, sans-serif;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      transition:
        background-color 180ms ease,
        transform 180ms ease,
        opacity 180ms ease;
    }

    .submit:hover:not(:disabled) {
      background: #b84218;
      transform: translateY(-1px);
    }

    .submit:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 2px;
    }

    .submit:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .form-status {
      min-height: 24px;
      margin-top: 16px;
      text-align: center;
      font-size: 17px;
      line-height: 1.35;
    }

    .form-status[data-state="error"] {
      color: #a93412;
    }

    .form-status[data-state="success"] {
      color: var(--navy);
    }

    .honeypot {
      position: absolute !important;
      left: -10000px !important;
      width: 1px !important;
      height: 1px !important;
      overflow: hidden !important;
    }

    @media (max-width: 900px) {
      .site-header {
        width: min(100% - 32px, 1380px);
      }

      .nav a:not(.nav-cta) {
        display: none;
      }

      main {
        width: min(100% - 32px, 1110px);
        padding: 54px 0 86px;
      }

      .contact-form {
        padding: 34px 24px;
        border-radius: 22px;
      }
    }

    @media (max-width: 560px) {
      .site-header {
        padding: 20px 0;
      }

      .logo {
        width: 142px;
      }

      .nav-cta {
        padding: 11px 16px !important;
        font-size: 14px;
      }

      main {
        padding-top: 38px;
      }

      .intro {
        margin-bottom: 42px;
      }

      .intro p {
        font-size: 22px;
      }

      .contact-form {
        padding: 28px 18px;
      }

      .choices {
        display: grid;
      }

      .choice,
      .choice span {
        width: 100%;
      }

      .choice span {
        justify-content: center;
      }

      .text-input,
      .textarea {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <a class="logo" href="/" aria-label="RATTL home">
      <img
        src="/images/ODbGNB09BfHX4NeabD7DjKqgVBU.png"
        alt="RATTL"
      >
    </a>

    <nav class="nav" aria-label="Hoofdnavigatie">
      <a href="/#diensten">Coaching &amp; design</a>
      <a href="/#werkwijze">Over RATTL</a>
      <a class="nav-cta" href="/contact/" aria-current="page">Let's talk!</a>
    </nav>
  </header>

  <main>
    <section class="intro" aria-labelledby="contact-title">
      <h1 id="contact-title">Klaar om stappen te zetten?</h1>
      <p>
        Vertel me waar je mee zit. Of waar je naartoe wilt.
        De rest ontdekken we samen.
      </p>
    </section>

    <form class="contact-form" id="mail" novalidate>
      <label class="field">
        <span class="field-label">Hoe zal ik je noemen?</span>
        <input
          class="text-input"
          type="text"
          name="Naam"
          placeholder="Naam"
          autocomplete="name"
          required
        >
      </label>

      <label class="field">
        <span class="field-label">Hoe kan ik je bereiken?</span>
        <input
          class="text-input"
          type="email"
          name="E-mail"
          placeholder="E-mailadres"
          autocomplete="email"
          required
        >
      </label>

      <fieldset class="choice-group">
        <legend class="group-title">Waar denk je nu aan?</legend>

        <div class="choices">
          <label class="choice">
            <input
              type="radio"
              name="Hulpvraag"
              value="Design & animatie"
            >
            <span>Design &amp; animatie</span>
          </label>

          <label class="choice">
            <input
              type="radio"
              name="Hulpvraag"
              value="Brainstorm of sessie"
            >
            <span>Brainstorm of sessie</span>
          </label>

          <label class="choice">
            <input
              type="radio"
              name="Hulpvraag"
              value="Agile coaching"
            >
            <span>Agile coaching</span>
          </label>

          <label class="choice">
            <input
              type="radio"
              name="Hulpvraag"
              value="Persoonlijke coaching"
            >
            <span>Persoonlijke coaching</span>
          </label>

          <label class="choice">
            <input
              type="radio"
              name="Hulpvraag"
              value="Weet ik nog niet"
            >
            <span>Weet ik nog niet</span>
          </label>
        </div>
      </fieldset>

      <label class="field">
        <span class="field-label">Wat houdt je bezig?</span>
        <textarea
          class="textarea"
          name="Bericht"
          placeholder="Vertel in een paar zinnen waar je tegenaan loopt, wat je wilt bereiken of waar je nieuwsgierig naar bent."
          required
        ></textarea>
      </label>

      <div class="honeypot" aria-hidden="true">
        <label>
          Website
          <input
            type="text"
            name="website"
            tabindex="-1"
            autocomplete="off"
          >
        </label>
      </div>

      <button class="submit" type="submit">
        Versturen
      </button>

      <div
        class="form-status"
        data-rattl-form-status
        role="status"
        aria-live="polite"
      ></div>
    </form>
  </main>

  <script src="/force-contact-navigation.js"></script>
  <script src="/contact/form-handler.js"></script>
</body>
</html>
